
services:
  postgres-db:
    image: postgres:16
    container_name: securebank-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - securebank-network

  securebank-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: securebank-api
    restart: unless-stopped

    depends_on:
      postgres-db:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - securebank-network

volumes:
  postgres_data:

networks:
  securebank-network:
    driver: bridge
